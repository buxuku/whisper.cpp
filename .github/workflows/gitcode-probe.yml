name: GitCode probe (manual)

# 一次性能力探针：仅手动触发，验证 GitCode Release 上传硬上限 + git/LFS 可行性。
# 不参与构建；用 throwaway tag/分支，跑完自动清理，不碰生产 latest release。
on:
  workflow_dispatch:
    inputs:
      sizes_mb:
        description: 'PART A: Release API 试传尺寸(MB, 空格分隔)'
        default: '18 20 22 25'
      do_lfs:
        description: 'PART B: 测试 git push / Git LFS'
        type: boolean
        default: true
      lfs_plain_mb:
        description: 'PART B: 普通 git push 文件大小(MB)'
        default: '5'
      lfs_big_mb:
        description: 'PART B: Git LFS 文件大小(MB, 取 >20 以验证绕过附件上限)'
        default: '30'

concurrency:
  group: gitcode-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout probe script
        uses: actions/checkout@v6
        with:
          ref: builder
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Run GitCode probe
        run: bash scripts/gitcode-probe.sh
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: buxuku1
          GITCODE_REPO: whisper.node
          GITCODE_GIT_USER: buxuku1
          SIZES_MB: ${{ inputs.sizes_mb }}
          DO_LFS: ${{ inputs.do_lfs && '1' || '0' }}
          LFS_PLAIN_MB: ${{ inputs.lfs_plain_mb }}
          LFS_BIG_MB: ${{ inputs.lfs_big_mb }}
