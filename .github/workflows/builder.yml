name: Build whisper.cpp addons

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 0 * * 0'  # 每周日自动运行
  push:
    branches: [ builder ]  # 当有代码推送到builder分支时

jobs:
  # macOS ARM64 构建
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v3
        with:
          repository: ggml-org/whisper.cpp
          branch: master
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.14.0

      - name: Install dependencies
        run: |
          brew install cmake
          npm install -g cmake-js

      - name: Build
        run: |
          cd examples/addon.node
          npm install
          cd ../../
          mkdir -p artifacts
          
          # Build Metal variant
          npx cmake-js compile -T addon.node -B Release \
            --CDBUILD_SHARED_LIBS=OFF \
            --CDWHISPER_STATIC=ON \
            --CDGGML_METAL=ON \
            --CDGGML_METAL_USE_BF16=ON \
            --CDGGML_METAL_EMBED_LIBRARY=ON \
            --runtime=electron \
            --runtime-version=30.1.0 \
            --arch=arm64
          cp build/Release/addon.node.node artifacts/addon-macos-arm64.node
          
          # Clear build cache to ensure clean rebuild
          rm -rf build/CMakeCache.txt build/CMakeFiles/
          
          # Build CoreML variant (clean rebuild)
          npx cmake-js compile -T addon.node -B Release \
            --CDBUILD_SHARED_LIBS=OFF \
            --CDWHISPER_STATIC=ON \
            --CDWHISPER_COREML=ON \
            --runtime=electron \
            --runtime-version=30.1.0 \
            --arch=arm64
          cp build/Release/addon.node.node artifacts/addon-macos-arm64-coreml.node

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-macos-arm64
          path: |
            artifacts/addon-macos-arm64.node
            artifacts/addon-macos-arm64-coreml.node

  # macOS Intel 构建
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          branch: master
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.14.0

      - name: Install dependencies
        run: |
          brew install cmake
          npm install -g cmake-js

      - name: Build
        run: |
          cd examples/addon.node
          npm install
          cd ../../
          npx cmake-js compile -T addon.node -B Release \
            --CDBUILD_SHARED_LIBS=OFF \
            --CDWHISPER_STATIC=ON \
            --CDGGML_METAL=ON \
            --CDGGML_METAL_USE_BF16=ON \
            --CDGGML_METAL_EMBED_LIBRARY=ON \
            --runtime=electron \
            --runtime-version=30.1.0 \
            --arch=x64
          mkdir -p artifacts
          cp build/Release/addon.node.node artifacts/addon-macos-x64.node

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-macos-x64
          path: |
            artifacts/addon-macos-x64.node

  # Windows CUDA 12.4 构建
  windows-cuda-12-4:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: master
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.14.0

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1.2.16
        with:
          key: ${{ github.job }}
          variant: sccache
          evict-old-files: 5d

      - name: Install CUDA Toolkit 12.4.0
        run: |
          $ErrorActionPreference = "Stop"
          $CUDA_VERSION = "12.4.0"
          $CUDA_TOOLKIT_DIR = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$CUDA_VERSION"
          $CUDA_DOWNLOAD = "https://developer.download.nvidia.com/compute/cuda/redist"

          # Components versions
          $CUDART_VER   = "12.4.127"
          $NVCC_VER     = "12.4.131"
          $NVRTC_VER    = "12.4.127"
          $CUBLAS_VER   = "12.4.5.8"
          $NVTX_VER     = "12.4.127"
          $PROFILER_VER = "12.4.127"
          $VS_VER       = "12.4.127"
          $NVPROF_VER   = "12.4.127"
          $CCCL_VER     = "12.4.127"

          # Create the directory where the CUDA Toolkit will be installed
          New-Item -ItemType Directory -Force -Path $CUDA_TOOLKIT_DIR | Out-Null

          # Install unzip to extract the downloaded files
          choco install unzip -y

          # Download all the required components.
          # curl 必须带 -f(HTTP 错误返回非零) 和 --retry-all-errors(瞬时错误如 curl 52 Empty reply 也重试)，
          # 否则单个组件下载失败会被静默忽略，直到 CMake 链接阶段才报 CUDA::cublas not found。
          $components = @(
            "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-${CUDART_VER}-archive.zip",
            "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-${NVCC_VER}-archive.zip",
            "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-${NVRTC_VER}-archive.zip",
            "libcublas/windows-x86_64/libcublas-windows-x86_64-${CUBLAS_VER}-archive.zip",
            "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-${NVTX_VER}-archive.zip",
            "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-${PROFILER_VER}-archive.zip",
            "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-${VS_VER}-archive.zip",
            "cuda_nvprof/windows-x86_64/cuda_nvprof-windows-x86_64-${NVPROF_VER}-archive.zip",
            "cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-${CCCL_VER}-archive.zip"
          )
          # NVIDIA 的 redist CDN 会间歇性对存在的文件返回 404/52(Empty reply)，
          # 所以在 curl 自身重试之外再包一层外层重试，把单个组件的容错窗口拉到数分钟。
          foreach ($comp in $components) {
            $url = "$CUDA_DOWNLOAD/$comp"
            $ok = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "Downloading $comp (attempt $attempt/5) ..."
              curl.exe -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O "$url"
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "  curl failed (exit $LASTEXITCODE); NVIDIA CDN may be flaky, retrying in 20s ..."
              Start-Sleep -Seconds 20
            }
            if (-not $ok) { throw "Failed to download $url after 5 attempts (last curl exit $LASTEXITCODE)" }
          }

          # Extract all the downloaded files to the CUDA Toolkit directory
          unzip -q '*.zip' -d $CUDA_TOOLKIT_DIR

          # Copy all the extracted files to the main CUDA Toolkit directory
          xcopy "$CUDA_TOOLKIT_DIR\cuda_cudart-windows-x86_64-${CUDART_VER}-archive\*" "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\cuda_nvcc-windows-x86_64-${NVCC_VER}-archive\*"     "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\cuda_nvrtc-windows-x86_64-${NVRTC_VER}-archive\*"   "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\libcublas-windows-x86_64-${CUBLAS_VER}-archive\*"   "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\cuda_nvtx-windows-x86_64-${NVTX_VER}-archive\*"     "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\cuda_nvprof-windows-x86_64-${NVPROF_VER}-archive\*" "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\cuda_cccl-windows-x86_64-${CCCL_VER}-archive\*" "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\cuda_profiler_api-windows-x86_64-${PROFILER_VER}-archive\*" "$CUDA_TOOLKIT_DIR" /E /I /H /Y
          xcopy "$CUDA_TOOLKIT_DIR\visual_studio_integration-windows-x86_64-${VS_VER}-archive\visual_studio_integration\MSBuildExtensions\*" "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations" /E /I /H /Y

          # Verify cuBLAS installed correctly. FindCUDAToolkit needs cublas.lib to create the
          # CUDA::cublas target that ggml-cuda links against; otherwise the build fails late at CMake generate.
          if (-not (Test-Path "$CUDA_TOOLKIT_DIR\lib\x64\cublas.lib")) {
            throw "cublas.lib not found in $CUDA_TOOLKIT_DIR\lib\x64 - CUDA installation incomplete"
          }
          Write-Host "Verified: cublas.lib present in lib\x64"

          # Set environment variables
          echo "$CUDA_TOOLKIT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$CUDA_TOOLKIT_DIR\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_PATH=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "CUDA_PATH_V12_4=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify CUDA installation
        run: |
          nvcc --version
          echo "CUDA_PATH: $env:CUDA_PATH"

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: |
          choco install cmake 7zip -y
          npm install -g cmake-js

      - name: Build
        shell: powershell
        run: |
          cd examples/addon.node
          npm install
          cd ../../
          
          $buildParams = @(
            "--CDBUILD_SHARED_LIBS=OFF",
            "--CDWHISPER_STATIC=ON",
            "--CDGGML_CUDA=ON",
            "--CDGGML_NATIVE=OFF",
            "--CDCMAKE_CUDA_ARCHITECTURES=all-major",
            "--runtime=electron",
            "--runtime-version=30.1.0",
            "--arch=x64"
          )
          
          Write-Host "Build parameters: $($buildParams -join ' ')"
          npx cmake-js compile -T addon.node -B Release $buildParams
          
          New-Item -ItemType Directory -Force -Path "artifacts"
          Copy-Item "build/bin/Release/addon.node.node" -Destination "artifacts/addon-windows-cuda-1240-optimized.node"

      - name: Check sccache status after build
        run: sccache --show-stats

      - name: Copy CUDA DLLs
        shell: powershell
        run: |
          Write-Host "=== Copying CUDA Runtime DLLs ==="
          
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4.0"
          $dllPath = Join-Path $cudaPath "bin"
          
          Write-Host "DLL Path: $dllPath"
          
          $dllPatterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "nvblas64_*.dll"
          )
          
          $foundDlls = @()
          
          if (Test-Path $dllPath) {
            foreach ($pattern in $dllPatterns) {
              $dlls = Get-ChildItem $dllPath -Filter $pattern -ErrorAction SilentlyContinue
              if ($dlls) {
                $foundDlls += $dlls
              }
            }
            
            if ($foundDlls.Count -gt 0) {
              Write-Host "`nFound $($foundDlls.Count) runtime DLLs:"
              $foundDlls | ForEach-Object {
                Write-Host "  $($_.Name) - $($_.Length) bytes"
                Copy-Item $_.FullName -Destination "artifacts" -Force
              }
            } else {
              Write-Host "WARNING: No matching runtime DLLs found!"
            }
          }
          
          Write-Host "`n=== Final artifacts directory contents ==="
          Get-ChildItem "artifacts" | ForEach-Object { Write-Host "  $($_.Name) - $($_.Length) bytes" }

      - name: Compress artifacts
        shell: bash
        run: |
          OUTPUT_NAME="windows-cuda-1240-optimized"
          
          # Create .node.gz (addon only, for users with CUDA Toolkit installed)
          cd artifacts
          gzip -6 -k "addon-${OUTPUT_NAME}.node"
          mv "addon-${OUTPUT_NAME}.node.gz" "../addon-${OUTPUT_NAME}.node.gz"
          
          # Create .tar.gz (addon + DLLs bundle, for users without CUDA Toolkit)
          tar -cf - * | gzip -6 > "../${OUTPUT_NAME}.tar.gz"
          cd ..
          ls -lh *.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-cuda-1240-optimized
          path: |
            addon-windows-cuda-1240-optimized.node.gz
            windows-cuda-1240-optimized.tar.gz

  # Windows CUDA 13.0 构建
  windows-cuda-13-0:
