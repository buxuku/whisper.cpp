  # Windows x64 基础构建 (CPU only)
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v3
        with:
          repository: ggml-org/whisper.cpp
          branch: master
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.14.0
          
      - name: Install dependencies
        run: |
          choco install cmake -y
          npm install -g cmake-js

      - name: Build
        run: |
          cd examples/addon.node
          npm install
          cd ../../
          npx cmake-js compile -T addon.node -B Release `
            --CDBUILD_SHARED_LIBS=OFF `
            --CDWHISPER_STATIC=ON `
            --CDGGML_NATIVE=OFF `
            --runtime=electron `
            --runtime-version=30.1.0 `
            --arch=x64 `
            
          mkdir -p artifacts
          
          Copy-Item "build/bin/Release/addon.node.node" -Destination "artifacts/addon-windows-x64.node"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-windows-x64
          path: |
            artifacts/addon-windows-x64.node

