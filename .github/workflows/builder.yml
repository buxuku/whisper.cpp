name: Build whisper.cpp addons (Windows trial installer)

# ============================================================================
# 试用分支专用，不是发布流水线。
#
# 做什么：用 builder 当前的构建源（上游 tag + .github/upstream/patches）编出 Windows 的
# CPU / Vulkan 两个 addon，再把它们放进 SmartSub 的 Windows 安装包（SmartSub 取自 smartsub_ref，
# 默认 main），产出一个只用于真机实测的安装包 artifact（含 TRIAL-INFO.txt 溯源信息）。
#
# 为什么不会发布任何东西：
#   - 没有发布 / 更新 latest 的任务，也没有 release-* 快照任务；
#   - 顶层 permissions 只有 contents: read，令牌没有写 release / 写仓库内容的权限；
#   - 没有 push 触发，只能手动 dispatch；
#   - 不会触发 SmartSub 的 release.yml（这里只用 electron-builder --publish never 打包）。
# 只在一次性试用分支上 dispatch，不要合入 builder（builder 上的 builder.yml 才是发布流水线）。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 whisper.cpp 的 tag（留空 = 用 .github/upstream/tag 里固定的；latest = 上游当前最新的 vX.Y.Z）'
        type: string
        default: ''
      smartsub_ref:
        description: '要打包的 SmartSub 分支 / tag / 提交（留空 = main）'
        type: string
        default: 'main'
      publish:
        description: '试用工作流不发布；保留此输入只为兼容 gh workflow run -f publish=false 的写法，取值没有任何影响'
        type: boolean
        default: false

# 只在同一个分支上互斥；一次性试用分支与 builder 分组不同，不会取消 builder 上的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 令牌只读：试用工作流里没有任何需要写权限的步骤。
permissions:
  contents: read

env:
  UPSTREAM_REPO: ggml-org/whisper.cpp
  # 2026-06-16 起 GitHub 强制 JS action 运行在 Node24 上，与 builder.yml 保持一致。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # 确定构建源：解出上游 tag、试套补丁、生成 build-info.json（见 prepare-source.yml）
  prepare:
    uses: ./.github/workflows/prepare-source.yml
    with:
      upstream_tag: ${{ inputs.upstream_tag || '' }}

  # Windows 构建（试用包只编 CPU / Vulkan 两个变体；CUDA 相关步骤原样保留，
  # 矩阵里没有 CUDA 项时它们全部被跳过。要试 CUDA 包，把 builder.yml 里的 cuda-12.4 / cuda-13.0 矩阵项加回来）
  # 全部使用 Ninja 生成器 + MSVC 环境（ilammy/msvc-dev-cmd），
  # 这是 sccache 真正生效的前提（VS/MSBuild 生成器不支持编译器 launcher）。
  build-windows:
    name: windows-${{ matrix.name }}
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            timeout: 180
            output: windows-x64
            package: plain
            artifact: addon-windows-x64
            # 试用包不编 CUDA。这两个键留空只是让下面 CUDA 步骤里的表达式在静态检查下有定义，
            # 运行时与不写等价（空串和缺省都为假，ccache / sccache 的选择也不变）。
            cuda_version: ''
            cuda_components: ''
          - name: vulkan
            timeout: 180
            vulkan: true
            cmake_flags: '--CDGGML_VULKAN=ON'
            output: windows-vulkan
            package: gz
            artifact: addon-windows-vulkan
    steps:
      # Windows 的 git 默认 core.autocrlf=true，检出时会把文本文件转成 CRLF。关掉它，让工作区与
      # Linux / macOS 逐字节一致（也是本地验证补丁时的状态）。本地模拟 autocrlf=true 时补丁同样能套上、
      # 补丁后的源码树哈希相同，所以这一步是求稳，不是补丁能套上的前提。必须在检出之前设置。
      - name: Use LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Clone upstream whisper.cpp (release tag)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      # 构建脚本和补丁在本仓库（builder 分支），单独检出到 _ci/
      - name: Checkout build scripts and patches
        uses: actions/checkout@v6
        with:
          path: _ci
          sparse-checkout: |
            .github/scripts
            .github/upstream

      # 补丁后的源码树必须与 prepare 任务算出的一致，保证各平台编译的是同一份源码
      - name: Apply patches
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECT_TREE: ${{ needs.prepare.outputs.tree }}
        run: bash _ci/.github/scripts/apply-patches.sh . build-info.json "$EXPECT_TREE"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.14.0

      # CUDA 任务用 ccache，其余用 sccache：上游 v1.9.x 起 nvcc 的命令行里多了
      # -DGGML_CUDA_FA_QUANTS=\"...\"（带转义引号的宏），sccache 在 Windows 上解析不了，
      # 报 "Could not parse shell line"（mozilla/sccache#2470）。上游自己的 Windows CUDA
      # 发布流水线用的也是 ccache。
      - name: Install compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: windows-${{ matrix.name }}
          variant: ${{ matrix.cuda_version && 'ccache' || 'sccache' }}
          evict-old-files: 5d
          max-size: 2G

      # Ninja 需要 cl.exe 在 PATH 中（含 INCLUDE/LIB 环境），由 vcvars 提供
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 用 NVIDIA redist 组件包手动装最小化 CUDA 工具链（官方安装器太慢且组件过多）。
      # Ninja 生成器不依赖 visual_studio_integration（那是 MSBuild 用的），故不安装。
      - name: Install CUDA Toolkit
        if: ${{ matrix.cuda_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $CUDA_VERSION = "${{ matrix.cuda_version }}"
          $CUDA_TOOLKIT_DIR = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$CUDA_VERSION"
          $CUDA_DOWNLOAD = "https://developer.download.nvidia.com/compute/cuda/redist"

          New-Item -ItemType Directory -Force -Path $CUDA_TOOLKIT_DIR | Out-Null
          choco install unzip -y

          $components = "${{ matrix.cuda_components }}".Trim() -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }

          # NVIDIA 的 redist CDN 会间歇性对存在的文件返回 404/52(Empty reply)，
          # 所以在 curl 自身重试之外再包一层外层重试，把单个组件的容错窗口拉到数分钟。
          foreach ($comp in $components) {
            $url = "$CUDA_DOWNLOAD/$comp"
            $ok = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "Downloading $comp (attempt $attempt/5) ..."
              curl.exe -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O "$url"
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "  curl failed (exit $LASTEXITCODE); NVIDIA CDN may be flaky, retrying in 20s ..."
              Start-Sleep -Seconds 20
            }
            if (-not $ok) { throw "Failed to download $url after 5 attempts (last curl exit $LASTEXITCODE)" }
          }

          # 解压并把各组件目录平铺合并进工具链目录（目录名均以 -archive 结尾，自动发现，
          # 不再按组件逐条 xcopy，12.4/13.0 组件差异由 cuda_components 列表本身表达）
          unzip -q '*.zip' -d $CUDA_TOOLKIT_DIR
          Get-ChildItem -Path $CUDA_TOOLKIT_DIR -Directory -Filter "*-archive" | ForEach-Object {
            xcopy "$($_.FullName)\*" "$CUDA_TOOLKIT_DIR" /E /I /H /Y | Out-Null
            Remove-Item -Recurse -Force $_.FullName
          }

          # 验证 cuBLAS 安装成功。FindCUDAToolkit 需要 cublas.lib 才能创建
          # ggml-cuda 链接所需的 CUDA::cublas target，否则要到 CMake generate 阶段才报错。
          if (-not (Test-Path "$CUDA_TOOLKIT_DIR\lib\x64\cublas.lib")) {
            throw "cublas.lib not found in $CUDA_TOOLKIT_DIR\lib\x64 - CUDA installation incomplete"
          }
          Write-Host "Verified: cublas.lib present in lib\x64"

          # 导出环境变量（CUDA_PATH_VX_Y 由版本号推导，如 12.4.0 -> CUDA_PATH_V12_4）
          $mm = (($CUDA_VERSION -split '\.')[0, 1]) -join '_'
          echo "$CUDA_TOOLKIT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$CUDA_TOOLKIT_DIR\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_PATH=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "CUDA_PATH_V$mm=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify CUDA installation
        if: ${{ matrix.cuda_version }}
        run: |
          nvcc --version
          echo "CUDA_PATH: $env:CUDA_PATH"

      # Vulkan SDK 安装方式与 llama.cpp 官方 release CI 一致（LunarG 静默安装器）。
      # SDK 提供编译期所需的 Vulkan 头文件、vulkan-1.lib 以及 glslc 着色器编译器；
      # 运行期的 vulkan-1.dll 由用户显卡驱动提供，无需随包分发。
      - name: Install Vulkan SDK
        if: ${{ matrix.vulkan }}
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Verify Vulkan SDK
        if: ${{ matrix.vulkan }}
        run: |
          glslc --version
          echo "VULKAN_SDK: $env:VULKAN_SDK"

      - name: Install dependencies
        run: |
          npm install -g cmake-js
          cd examples/addon.node
          npm install

      - name: Build
        shell: powershell
        env:
          # Ninja 直接调用 link.exe，不会像 MSBuild 那样在使用 /DELAYLOAD 时自动
          # 链接 delayimp.lib（__delayLoadHelper2 的实现），否则报 LNK2001。
          # link.exe 原生支持读取 LINK 环境变量并前置到每次链接命令，借此补上。
          LINK: delayimp.lib
        run: |
          $buildParams = @(
            "--CDBUILD_SHARED_LIBS=OFF",
            "--CDWHISPER_STATIC=ON",
            "--CDGGML_NATIVE=OFF",
            "--runtime=electron",
            "--runtime-version=30.1.0",
            "--arch=x64",
            "-G", "Ninja"
          )
          $extraFlags = "${{ matrix.cmake_flags }}" -split ' ' | Where-Object { $_ }
          $buildParams += $extraFlags

          Write-Host "Build parameters: $($buildParams -join ' ')"
          npx cmake-js compile -T addon.node -B Release @buildParams
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $node = Get-ChildItem -Path build -Recurse -File |
            Where-Object { $_.Name -in @('addon.node', 'addon.node.node') } |
            Select-Object -First 1
          if (-not $node) { throw "addon.node / addon.node.node not found under build/" }
          Copy-Item $node.FullName -Destination "artifacts/addon-${{ matrix.output }}.node"

      - name: Check compiler cache status after build
        run: ${{ matrix.cuda_version && 'ccache' || 'sccache' }} --show-stats

      # 补丁 0002 的功能必须真的编进产物，见 check-addon-features.sh
      - name: Verify patches are compiled in
        shell: bash
        run: bash _ci/.github/scripts/check-addon-features.sh "artifacts/addon-${{ matrix.output }}.node"

      - name: Copy CUDA DLLs
        if: ${{ matrix.cuda_version }}
        shell: powershell
        run: |
          Write-Host "=== Copying CUDA Runtime DLLs ==="
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ matrix.cuda_version }}"
          # CUDA 12.x 的运行库在 bin\，13.x 在 bin\x64\，两处都查
          $dllDirs = @((Join-Path $cudaPath "bin"), (Join-Path $cudaPath "bin\x64")) | Where-Object { Test-Path $_ }
          $dllPatterns = @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll", "nvblas64_*.dll")

          $foundDlls = @()
          foreach ($dir in $dllDirs) {
            foreach ($pattern in $dllPatterns) {
              $foundDlls += Get-ChildItem $dir -Filter $pattern -ErrorAction SilentlyContinue
            }
          }

          if ($foundDlls.Count -gt 0) {
            Write-Host "Found $($foundDlls.Count) runtime DLLs:"
            $foundDlls | ForEach-Object {
              Write-Host "  $($_.Name) - $($_.Length) bytes"
              Copy-Item $_.FullName -Destination "artifacts" -Force
            }
          } else {
            Write-Host "WARNING: No matching runtime DLLs found!"
          }

          Write-Host "`n=== Final artifacts directory contents ==="
          Get-ChildItem "artifacts" | ForEach-Object { Write-Host "  $($_.Name) - $($_.Length) bytes" }

      - name: Package
        shell: bash
        run: |
          MODE="${{ matrix.package }}"
          BASE="${{ matrix.output }}"
          mkdir -p upload
          case "$MODE" in
            plain)
              # 未压缩 .node，直接发布
              cp artifacts/*.node upload/
              ;;
            gz)
              # 仅 addon 的 .node.gz
              gzip -6 -c "artifacts/addon-${BASE}.node" > "upload/addon-${BASE}.node.gz"
              ;;
            cuda)
              # .node.gz（已装 CUDA Toolkit 的用户）+ tar.gz（addon+运行库，独立运行）
              gzip -6 -c "artifacts/addon-${BASE}.node" > "upload/addon-${BASE}.node.gz"
              (cd artifacts && tar -cf - *) | gzip -6 > "upload/${BASE}.tar.gz"
              ;;
          esac
          ls -lh upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: upload/*
          retention-days: 1

  # 把上面编出的 addon 放进 SmartSub 的 Windows 安装包，只上传 artifact，不发布。
  # 步骤与 SmartSub 的 .github/workflows/release.yml 里 Windows 任务一致（同一个 runner、Node 版本、
  # 环境变量、打包命令和体积门禁），唯一的区别是：release.yml 的 “Prepare whisper addon (bundled)”
  # 从 latest 拉旧 addon，这里换成使用本次运行编出的 addon。
  package-smartsub:
    name: SmartSub installer (windows-x64)
    needs: [prepare, build-windows]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ELECTRON_BUILDER_HTTP_TIMEOUT: 6000000
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    steps:
      - name: Check out SmartSub
        uses: actions/checkout@v6
        with:
          repository: buxuku/SmartSub
          ref: ${{ inputs.smartsub_ref || 'main' }}
          persist-credentials: false

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0

      # 同一次运行里 build-windows 上传的产物：每个 artifact 落在以 artifact 名命名的子目录
      # （与 create-update-release 任务里 artifacts/build-info/build-info.json 的布局一致）
      - name: Download addons built in this run
        uses: actions/download-artifact@v8
        with:
          path: _trial/in

      - name: Place addons into extraResources/addons
        shell: bash
        run: |
          set -euo pipefail
          find _trial/in -type f | sort
          mkdir -p extraResources/addons
          # 与 scripts/fetch-whisper-addon.mjs 在 win32-x64 上的落地方式一致：
          #   addon-windows-x64.node        => addon.node
          #   addon-windows-vulkan.node.gz  => addon.vulkan.node（gunzip）
          cp _trial/in/addon-windows-x64/addon-windows-x64.node extraResources/addons/addon.node
          gzip -dc _trial/in/addon-windows-vulkan/addon-windows-vulkan.node.gz > extraResources/addons/addon.vulkan.node
          ls -l extraResources/addons
          # 与 fetch-whisper-addon.mjs 相同的占位文件判断：真实 addon 至少数百 KB
          for f in extraResources/addons/addon.node extraResources/addons/addon.vulkan.node; do
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -lt 102400 ]; then
              echo "::error::$f looks invalid ($size bytes)"
              exit 1
            fi
          done

      - name: Inject build info
        shell: bash
        run: |
          export BUILD_PLATFORM=win32
          export BUILD_ARCH=x64
          node scripts/inject-build-info.js

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile application code
        run: yarn build

      - name: Prepare sherpa native libs (bundled)
        shell: bash
        run: |
          yarn sherpa:fetch
          ls extraResources/sherpa/native

      - name: Build Electron app
        shell: bash
        run: |
          export BUILD_PLATFORM="win32"
          export BUILD_ARCH=x64
          yarn run electron-builder --win --x64 --publish never

      - name: Bundle size gate (<=200MB)
        shell: bash
        run: yarn size:check

      # 安装包里实际带上的 addon 必须就是本次运行编出的那两个，否则这个试用包就没有意义。
      - name: Verify the installer bundles the addons built in this run
        shell: bash
        run: |
          set -euo pipefail
          UNPACKED=dist/win-unpacked/resources/extraResources/addons
          ls -l "$UNPACKED"
          want_x64=$(sha256sum _trial/in/addon-windows-x64/addon-windows-x64.node | cut -d' ' -f1)
          want_vk=$(gzip -dc _trial/in/addon-windows-vulkan/addon-windows-vulkan.node.gz | sha256sum | cut -d' ' -f1)
          got_x64=$(sha256sum "$UNPACKED/addon.node" | cut -d' ' -f1)
          got_vk=$(sha256sum "$UNPACKED/addon.vulkan.node" | cut -d' ' -f1)
          echo "addon.node         built=$want_x64"
          echo "                   packed=$got_x64"
          echo "addon.vulkan.node  built=$want_vk"
          echo "                   packed=$got_vk"
          if [ "$want_x64" != "$got_x64" ] || [ "$want_vk" != "$got_vk" ]; then
            echo "::error::the addons inside the installer differ from the ones built in this run"
            exit 1
          fi

      - name: Stage trial installer and provenance
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.commit }}
          PATCHED_TREE: ${{ needs.prepare.outputs.tree }}
          FORK_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMARTSUB_REF: ${{ inputs.smartsub_ref || 'main' }}
        run: |
          set -euo pipefail
          SS_SHA=$(git rev-parse HEAD)
          SS_SUBJECT=$(git log -1 --format=%s)
          SS_VERSION=$(node -p "require('./package.json').version")
          SRC="dist/SmartSub_Windows_${SS_VERSION}_x64.exe"
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC not found"
            ls -l dist
            exit 1
          fi
          # 文件名里带上 SmartSub 提交和上游 whisper.cpp tag，装到真机后一眼能认出是哪个试用包
          NAME="SmartSub_Windows_${SS_VERSION}_x64_TRIAL_ss-${SS_SHA:0:8}_whisper-${UPSTREAM_TAG}.exe"
          OUT=_trial/out
          UNPACKED=dist/win-unpacked/resources/extraResources/addons
          mkdir -p "$OUT"
          cp "$SRC" "$OUT/$NAME"
          cp _trial/in/build-info/build-info.json "$OUT/build-info.json"
          kv() { printf '%-46s %s\n' "$1" "$2"; }
          {
            echo 'SmartSub Windows trial installer (NOT a release build)'
            echo '======================================================'
            kv 'built (UTC):' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            kv 'workflow run:' "$RUN_URL"
            echo
            echo '[installer]'
            kv 'file:' "$NAME"
            kv 'size (bytes):' "$(wc -c < "$OUT/$NAME" | tr -d ' ')"
            kv 'sha256:' "$(sha256sum "$OUT/$NAME" | cut -d' ' -f1)"
            echo
            echo '[SmartSub]'
            kv 'repository @ ref:' "buxuku/SmartSub @ $SMARTSUB_REF"
            kv 'commit:' "$SS_SHA"
            kv 'subject:' "$SS_SUBJECT"
            kv 'package.json version:' "$SS_VERSION (same as the stable release; the version cannot tell builds apart)"
            echo
            echo '[whisper.cpp addons built in this run; nothing was published]'
            kv 'fork commit (trial branch):' "$FORK_SHA"
            kv 'upstream tag:' "$UPSTREAM_TAG"
            kv 'upstream commit:' "$UPSTREAM_COMMIT"
            kv 'patched source tree:' "$PATCHED_TREE"
            kv 'addon-windows-x64.node sha256:' "$(sha256sum _trial/in/addon-windows-x64/addon-windows-x64.node | cut -d' ' -f1)"
            kv 'addon-windows-vulkan.node.gz sha256:' "$(sha256sum _trial/in/addon-windows-vulkan/addon-windows-vulkan.node.gz | cut -d' ' -f1)"
            kv 'addon-windows-vulkan.node (gunzip) sha256:' "$(gzip -dc _trial/in/addon-windows-vulkan/addon-windows-vulkan.node.gz | sha256sum | cut -d' ' -f1)"
            echo
            echo '[inside the installer: resources\extraResources\addons\ (verified identical to the build above)]'
            kv 'addon.node sha256:' "$(sha256sum "$UNPACKED/addon.node" | cut -d' ' -f1)"
            kv 'addon.vulkan.node sha256:' "$(sha256sum "$UNPACKED/addon.vulkan.node" | cut -d' ' -f1)"
            echo
            echo '[build-info.json]'
            cat _trial/in/build-info/build-info.json
          } > "$OUT/TRIAL-INFO.txt"
          {
            echo '### SmartSub Windows trial installer'
            echo
            echo '```text'
            cat "$OUT/TRIAL-INFO.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$OUT"

      # 老 CPU（无 AVX2）真机用：legacy-cpu 预发布里持久存在的 AVX 构建（同样是上游 tag + 补丁）。
      # 只读下载并核对 SHA256SUMS.txt；失败不影响主产物。
      - name: Fetch legacy-cpu AVX addons (extras, read-only)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _trial/out/extras
          cd _trial/out/extras
          gh release download legacy-cpu --repo "$GITHUB_REPOSITORY" \
            --pattern 'addon-windows-x64-avx.node' \
            --pattern 'addon-windows-vulkan-avx.node' \
            --pattern 'SHA256SUMS.txt'
          sha256sum --check --ignore-missing SHA256SUMS.txt
          ls -l

      - name: Upload trial installer
        uses: actions/upload-artifact@v7
        with:
          name: smartsub-win-x64-trial
          path: _trial/out/**
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
