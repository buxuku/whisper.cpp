          $NVRTC_VER    = "13.0.88"
          $NVVM_VER     = "13.0.88"
          $CUBLAS_VER   = "13.1.0.3"
          $NVTX_VER     = "13.0.85"
          $PROFILER_VER = "13.0.85"
          $VS_VER       = "13.0.85"
          $CCCL_VER     = "13.0.85"

