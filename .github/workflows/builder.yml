name: Build whisper.cpp addons

on:
  workflow_dispatch:  # 手动触发
    inputs:
      source_ref:
        description: 'buxuku/whisper.cpp 中用于构建的分支/ref'
        default: 'feature/addon-cancel'
      sync_gitcode_only:
        description: '跳过构建，仅将 GitHub latest Release 同步到 GitCode（用于验证）'
        type: boolean
        default: false
  push:
    branches: [ builder ]  # 当有代码推送到builder分支时
    paths-ignore:
      - '**.md'  # 文档改动不触发全量构建

# 同一时间只允许一个流水线运行：新触发自动取消进行中的旧构建。
# 多个 run 并行时完成顺序不可预测，旧 run 后完成会用旧产物覆盖
# latest release 的同名资产，导致 latest 新旧混杂、checksum 与资产不一致。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# 构建源：buxuku/whisper.cpp 的指定分支，默认 feature/addon-cancel
# （= 上游 master + addon.node 取消转写补丁）。手动触发可用 source_ref 覆盖。
# 上游同步流程：master 同步上游后，将 feature 分支 rebase 到 master 再重新构建。
env:
  SRC_REPO: buxuku/whisper.cpp
  SRC_REF: ${{ inputs.source_ref || 'feature/addon-cancel' }}
  # 2026-06-16 起 GitHub 强制 JS action 运行在 Node24 上。提前开启强制模式，
  # 让仍声明 node20 的 action（如 ilammy/msvc-dev-cmd）也在 Node24 下实际验证，
  # 避免强制切换日出现意外。其余 action 已升级到原生 node24 版本。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# 缓存说明：所有平台均启用编译缓存（ccache/sccache）。
# ggml 的 CMake 在 PATH 中发现 ccache/sccache 后会自动通过 RULE_LAUNCH_COMPILE
# 挂载（含 nvcc），无需额外传参；该机制仅对 Ninja/Makefiles 生成器生效，
# 因此 Windows 构建显式使用 -G Ninja（MSBuild 下 sccache 不会生效）。
# 首次运行为冷缓存，从第二次构建开始才能体现加速效果。

jobs:
  # macOS 构建（arm64: Metal + CoreML 两个变体；x64: Metal）
  build-macos:
    name: macos-${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_gitcode_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            coreml: true
          - arch: x64
            runner: macos-15-intel
            coreml: false
    env:
      # 锁定最低部署目标：用 macOS 15 SDK 编译时，macOS 15 新 API（如
      # MTLResidencySet*）会自动转为 weak import，运行时由源码中的
      # @available(macOS 15.0, *) 守卫跳过；不设置则 minos 跟随构建机系统
      # 版本（15.x），导致老系统 dlopen 失败。CMake 会读取该环境变量并
      # 初始化 CMAKE_OSX_DEPLOYMENT_TARGET。
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.14.0

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: macos-${{ matrix.arch }}
          evict-old-files: 5d
          max-size: 1G

      - name: Install dependencies
        run: |
          npm install -g cmake-js
          cd examples/addon.node
          npm install

      - name: Build (Metal)
        run: |
          mkdir -p artifacts
          npx cmake-js compile -T addon.node -B Release \
            --CDBUILD_SHARED_LIBS=OFF \
            --CDWHISPER_STATIC=ON \
            --CDGGML_METAL=ON \
            --CDGGML_METAL_USE_BF16=ON \
            --CDGGML_METAL_EMBED_LIBRARY=ON \
            --runtime=electron \
            --runtime-version=30.1.0 \
            --arch=${{ matrix.arch }}
          cp "$(find build -name 'addon.node.node' -type f | head -n 1)" "artifacts/addon-macos-${{ matrix.arch }}.node"

      - name: Build (CoreML)
        if: ${{ matrix.coreml }}
        run: |
          # 清除配置缓存以切换变体（对象级缓存由 ccache 接管，未变更的编译单元仍然命中）
          rm -rf build/CMakeCache.txt build/CMakeFiles/
          npx cmake-js compile -T addon.node -B Release \
            --CDBUILD_SHARED_LIBS=OFF \
            --CDWHISPER_STATIC=ON \
            --CDWHISPER_COREML=ON \
            --runtime=electron \
            --runtime-version=30.1.0 \
            --arch=${{ matrix.arch }}
          cp "$(find build -name 'addon.node.node' -type f | head -n 1)" "artifacts/addon-macos-${{ matrix.arch }}-coreml.node"

      - name: Verify deployment target
        run: |
          for f in artifacts/*.node; do
            echo "== $f"
            vtool -show-build "$f" | grep -E 'minos|sdk' || true
            minos=$(vtool -show-build "$f" | awk '/minos/{print $2}' | head -n1)
            if [ "$minos" != "12.0" ]; then
              echo "::error::$f minos=$minos (expected 12.0)"
              exit 1
            fi
            # macOS 15 的 Metal residency set 符号必须是 weak 引用，否则老系统 dlopen 失败
            if nm -m "$f" | grep MTLResidencySetDescriptor | grep -v weak; then
              echo "::error::$f has a strong (non-weak) MTLResidencySetDescriptor reference"
              exit 1
            fi
          done

      - name: Package
        run: |
          mkdir -p upload
          cp artifacts/*.node upload/
          ls -lh upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: addon-macos-${{ matrix.arch }}
          path: upload/*

  # Windows 构建（CPU / Vulkan / CUDA 12.4 / CUDA 13.0）
  # 全部使用 Ninja 生成器 + MSVC 环境（ilammy/msvc-dev-cmd），
  # 这是 sccache 真正生效的前提（VS/MSBuild 生成器不支持编译器 launcher）。
  build-windows:
    name: windows-${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_gitcode_only != true }}
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            timeout: 180
            output: windows-x64
            package: plain
            artifact: addon-windows-x64
          - name: vulkan
            timeout: 180
            vulkan: true
            cmake_flags: '--CDGGML_VULKAN=ON'
            output: windows-vulkan
            package: gz
            artifact: addon-windows-vulkan
          - name: cuda-12.4
            timeout: 360
            cuda_version: '12.4.0'
            # curl 必须带 -f(HTTP 错误返回非零) 和 --retry-all-errors(瞬时错误如 curl 52 Empty reply 也重试)，
            # 否则单个组件下载失败会被静默忽略，直到 CMake 链接阶段才报 CUDA::cublas not found。
            cuda_components: |
              cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.4.127-archive.zip
              cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.4.131-archive.zip
              cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-12.4.127-archive.zip
              libcublas/windows-x86_64/libcublas-windows-x86_64-12.4.5.8-archive.zip
              cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-12.4.127-archive.zip
              cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-12.4.127-archive.zip
              cuda_nvprof/windows-x86_64/cuda_nvprof-windows-x86_64-12.4.127-archive.zip
              cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.4.127-archive.zip
            cmake_flags: '--CDGGML_CUDA=ON --CDCMAKE_CUDA_ARCHITECTURES=all-major'
            output: windows-cuda-1240-optimized
            package: cuda
            artifact: windows-cuda-1240-optimized
          - name: cuda-13.0
            timeout: 360
            cuda_version: '13.0.2'
            cuda_components: |
              cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.0.96-archive.zip
              cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.0.88-archive.zip
              cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.0.88-archive.zip
              cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-13.0.88-archive.zip
              libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.0.88-archive.zip
              libcublas/windows-x86_64/libcublas-windows-x86_64-13.1.0.3-archive.zip
              cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-13.0.85-archive.zip
              cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-13.0.85-archive.zip
              cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-13.0.85-archive.zip
            # CUDA 13 移除了 SM 7.5 之前的架构支持，这里显式枚举 Turing~Hopper，
            # 90-virtual 提供 PTX 供更新的 GPU（Blackwell 等）JIT。
            cmake_flags: '--CDGGML_CUDA=ON --CDCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90;90-virtual'
            output: windows-cuda-1302-optimized
            package: cuda
            artifact: windows-cuda-1302-optimized
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.14.0

      - name: Install sccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: windows-${{ matrix.name }}
          variant: sccache
          evict-old-files: 5d
          max-size: 2G

      # Ninja 需要 cl.exe 在 PATH 中（含 INCLUDE/LIB 环境），由 vcvars 提供
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 用 NVIDIA redist 组件包手动装最小化 CUDA 工具链（官方安装器太慢且组件过多）。
      # Ninja 生成器不依赖 visual_studio_integration（那是 MSBuild 用的），故不安装。
      - name: Install CUDA Toolkit
        if: ${{ matrix.cuda_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $CUDA_VERSION = "${{ matrix.cuda_version }}"
          $CUDA_TOOLKIT_DIR = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$CUDA_VERSION"
          $CUDA_DOWNLOAD = "https://developer.download.nvidia.com/compute/cuda/redist"

          New-Item -ItemType Directory -Force -Path $CUDA_TOOLKIT_DIR | Out-Null
          choco install unzip -y

          $components = "${{ matrix.cuda_components }}".Trim() -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }

          # NVIDIA 的 redist CDN 会间歇性对存在的文件返回 404/52(Empty reply)，
          # 所以在 curl 自身重试之外再包一层外层重试，把单个组件的容错窗口拉到数分钟。
          foreach ($comp in $components) {
            $url = "$CUDA_DOWNLOAD/$comp"
            $ok = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "Downloading $comp (attempt $attempt/5) ..."
              curl.exe -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -O "$url"
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "  curl failed (exit $LASTEXITCODE); NVIDIA CDN may be flaky, retrying in 20s ..."
              Start-Sleep -Seconds 20
            }
            if (-not $ok) { throw "Failed to download $url after 5 attempts (last curl exit $LASTEXITCODE)" }
          }

          # 解压并把各组件目录平铺合并进工具链目录（目录名均以 -archive 结尾，自动发现，
          # 不再按组件逐条 xcopy，12.4/13.0 组件差异由 cuda_components 列表本身表达）
          unzip -q '*.zip' -d $CUDA_TOOLKIT_DIR
          Get-ChildItem -Path $CUDA_TOOLKIT_DIR -Directory -Filter "*-archive" | ForEach-Object {
            xcopy "$($_.FullName)\*" "$CUDA_TOOLKIT_DIR" /E /I /H /Y | Out-Null
            Remove-Item -Recurse -Force $_.FullName
          }

          # 验证 cuBLAS 安装成功。FindCUDAToolkit 需要 cublas.lib 才能创建
          # ggml-cuda 链接所需的 CUDA::cublas target，否则要到 CMake generate 阶段才报错。
          if (-not (Test-Path "$CUDA_TOOLKIT_DIR\lib\x64\cublas.lib")) {
            throw "cublas.lib not found in $CUDA_TOOLKIT_DIR\lib\x64 - CUDA installation incomplete"
          }
          Write-Host "Verified: cublas.lib present in lib\x64"

          # 导出环境变量（CUDA_PATH_VX_Y 由版本号推导，如 12.4.0 -> CUDA_PATH_V12_4）
          $mm = (($CUDA_VERSION -split '\.')[0, 1]) -join '_'
          echo "$CUDA_TOOLKIT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$CUDA_TOOLKIT_DIR\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_PATH=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "CUDA_PATH_V$mm=$CUDA_TOOLKIT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify CUDA installation
        if: ${{ matrix.cuda_version }}
        run: |
          nvcc --version
          echo "CUDA_PATH: $env:CUDA_PATH"

      # Vulkan SDK 安装方式与 llama.cpp 官方 release CI 一致（LunarG 静默安装器）。
      # SDK 提供编译期所需的 Vulkan 头文件、vulkan-1.lib 以及 glslc 着色器编译器；
      # 运行期的 vulkan-1.dll 由用户显卡驱动提供，无需随包分发。
      - name: Install Vulkan SDK
        if: ${{ matrix.vulkan }}
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Verify Vulkan SDK
        if: ${{ matrix.vulkan }}
        run: |
          glslc --version
          echo "VULKAN_SDK: $env:VULKAN_SDK"

      - name: Install dependencies
        run: |
          npm install -g cmake-js
          cd examples/addon.node
          npm install

      - name: Build
        shell: powershell
        env:
          # Ninja 直接调用 link.exe，不会像 MSBuild 那样在使用 /DELAYLOAD 时自动
          # 链接 delayimp.lib（__delayLoadHelper2 的实现），否则报 LNK2001。
          # link.exe 原生支持读取 LINK 环境变量并前置到每次链接命令，借此补上。
          LINK: delayimp.lib
        run: |
          $buildParams = @(
            "--CDBUILD_SHARED_LIBS=OFF",
            "--CDWHISPER_STATIC=ON",
            "--CDGGML_NATIVE=OFF",
            "--runtime=electron",
            "--runtime-version=30.1.0",
            "--arch=x64",
            "-G", "Ninja"
          )
          $extraFlags = "${{ matrix.cmake_flags }}" -split ' ' | Where-Object { $_ }
          $buildParams += $extraFlags

          Write-Host "Build parameters: $($buildParams -join ' ')"
          npx cmake-js compile -T addon.node -B Release @buildParams
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $node = Get-ChildItem -Path build -Recurse -Filter "addon.node.node" | Select-Object -First 1
          if (-not $node) { throw "addon.node.node not found under build/" }
          Copy-Item $node.FullName -Destination "artifacts/addon-${{ matrix.output }}.node"

      - name: Check sccache status after build
        run: sccache --show-stats

      - name: Copy CUDA DLLs
        if: ${{ matrix.cuda_version }}
        shell: powershell
        run: |
          Write-Host "=== Copying CUDA Runtime DLLs ==="
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ matrix.cuda_version }}"
          # CUDA 12.x 的运行库在 bin\，13.x 在 bin\x64\，两处都查
          $dllDirs = @((Join-Path $cudaPath "bin"), (Join-Path $cudaPath "bin\x64")) | Where-Object { Test-Path $_ }
          $dllPatterns = @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll", "nvblas64_*.dll")

          $foundDlls = @()
          foreach ($dir in $dllDirs) {
            foreach ($pattern in $dllPatterns) {
              $foundDlls += Get-ChildItem $dir -Filter $pattern -ErrorAction SilentlyContinue
            }
          }

          if ($foundDlls.Count -gt 0) {
            Write-Host "Found $($foundDlls.Count) runtime DLLs:"
            $foundDlls | ForEach-Object {
              Write-Host "  $($_.Name) - $($_.Length) bytes"
              Copy-Item $_.FullName -Destination "artifacts" -Force
            }
          } else {
            Write-Host "WARNING: No matching runtime DLLs found!"
          }

          Write-Host "`n=== Final artifacts directory contents ==="
          Get-ChildItem "artifacts" | ForEach-Object { Write-Host "  $($_.Name) - $($_.Length) bytes" }

      - name: Package
        shell: bash
        run: |
          MODE="${{ matrix.package }}"
          BASE="${{ matrix.output }}"
          mkdir -p upload
          case "$MODE" in
            plain)
              # 未压缩 .node，直接发布
              cp artifacts/*.node upload/
              ;;
            gz)
              # 仅 addon 的 .node.gz
              gzip -6 -c "artifacts/addon-${BASE}.node" > "upload/addon-${BASE}.node.gz"
              ;;
            cuda)
              # .node.gz（已装 CUDA Toolkit 的用户）+ tar.gz（addon+运行库，独立运行）
              gzip -6 -c "artifacts/addon-${BASE}.node" > "upload/addon-${BASE}.node.gz"
              (cd artifacts && tar -cf - *) | gzip -6 > "upload/${BASE}.tar.gz"
              ;;
          esac
          ls -lh upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: upload/*

  # Linux 构建（CPU / Vulkan / CUDA 12.4 / CUDA 13.0）
  # CUDA 构建直接在 nvidia/cuda devel 容器内进行：省去 CUDA 网络安装与清盘步骤、
  # 摆脱对 NVIDIA CDN 的运行时依赖、CUDA 小版本由镜像 digest 锁定可复现。
  # （如需进一步降低 glibc 基线以兼容更老的发行版，可改用 *-devel-ubuntu20.04 镜像。）
  build-linux:
    name: linux-${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_gitcode_only != true }}
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    # 容器内 run 步骤默认用 sh(dash) 执行，bash 数组语法会报错；统一指定 bash
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            timeout: 180
            output: linux-x64
            package: plain
            artifact: addon-linux-x64
          - name: vulkan
            timeout: 180
            vulkan: true
            cmake_flags: '--CDGGML_VULKAN=ON'
            output: linux-vulkan
            package: gz
            artifact: addon-linux-vulkan
          - name: cuda-12.4
            timeout: 360
            container: nvidia/cuda:12.4.0-devel-ubuntu22.04
            cmake_flags: '--CDGGML_CUDA=ON --CDCMAKE_CUDA_ARCHITECTURES=all-major'
            output: linux-cuda-1240-optimized
            package: cuda
            artifact: linux-cuda-1240-optimized
          - name: cuda-13.0
            timeout: 360
            container: nvidia/cuda:13.0.2-devel-ubuntu22.04
            cmake_flags: '--CDGGML_CUDA=ON --CDCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90;90-virtual'
            output: linux-cuda-1302-optimized
            package: cuda
            artifact: linux-cuda-1302-optimized
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      # 容忍 __DATE__/__TIME__ 宏，提高缓存命中率（ggml 在 configure 期设置的
      # 同名环境变量不会传递到实际编译进程，需在 job 级显式设置）
      CCACHE_SLOPPINESS: time_macros
    steps:
      # 容器内无 sudo 且缺 git/cmake 等基础工具；runner 上则带 sudo。
      # git 必须在 checkout 之前装好，否则 actions/checkout 退化为 tarball 下载。
      - name: Install system dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y build-essential git ninja-build ccache zstd python3-pip
          # nvidia/cuda 容器没有 cmake；ubuntu22.04 apt 的 cmake(3.22) 不支持
          # CMAKE_CUDA_ARCHITECTURES=all-major（需 >=3.23），用 pip 装固定版本
          if [ -n "${{ matrix.container }}" ]; then
            $SUDO pip3 install 'cmake==3.31.*'
          fi
          cmake --version
          ccache --version

      - name: Clone whisper.cpp repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.14.0

      # 滚动缓存：精确 key 永不命中（带 run_id），restore-keys 前缀匹配恢复最近一次缓存，
      # 保证每次 run 结束都会保存更新后的缓存
      - name: ccache cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.name }}-

      # 通过 LunarG 官方 apt 源安装 vulkan-sdk（含头文件、loader 和 glslc），
      # 与 llama.cpp 官方 release CI 的 ubuntu-22.04 Vulkan 构建方式一致。
      # 运行期的 libvulkan.so.1 由用户的显卡驱动栈（mesa/闭源驱动）提供。
      - name: Install Vulkan SDK
        if: ${{ matrix.vulkan }}
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers vulkan-sdk
          glslc --version

      - name: Verify CUDA installation
        if: ${{ matrix.container }}
        run: |
          nvcc --version
          ls /usr/local/cuda/lib64 | head -n 20

      - name: Install dependencies
        run: |
          npm install -g cmake-js
          cd examples/addon.node
          npm install

      - name: Build
        run: |
          BUILD_PARAMS=(
            "--CDBUILD_SHARED_LIBS=OFF"
            "--CDWHISPER_STATIC=ON"
            "--CDGGML_NATIVE=OFF"
            "--CDCMAKE_POSITION_INDEPENDENT_CODE=ON"
            "--runtime=electron"
            "--runtime-version=30.1.0"
            "--arch=x64"
          )
          # 用 read 分词而不是直接写进数组字面量：CUDA 架构列表里的分号
          # 在 bash 数组括号内会被当作命令分隔符导致语法错误
          EXTRA_FLAGS=()
          if [ -n "${{ matrix.cmake_flags }}" ]; then
            read -r -a EXTRA_FLAGS <<< "${{ matrix.cmake_flags }}"
          fi
          BUILD_PARAMS+=( "${EXTRA_FLAGS[@]}" )

          echo "Build parameters: ${BUILD_PARAMS[@]}"
          npx cmake-js compile -T addon.node -B Release "${BUILD_PARAMS[@]}"

          mkdir -p artifacts
          cp "$(find build -name 'addon.node.node' -type f | head -n 1)" "artifacts/addon-${{ matrix.output }}.node"

      - name: Check ccache status after build
        run: ccache -s

      # 随包提供 CUDA 运行库（tar.gz 捆绑包），用户只装显卡驱动即可运行
      - name: Copy CUDA libs
        if: ${{ matrix.container }}
        run: |
          CUDA_LIB_PATH="/usr/local/cuda/lib64"
          echo "Copying CUDA libs from: $CUDA_LIB_PATH"

          cp -v "$CUDA_LIB_PATH"/libcudart.so* artifacts/ 2>/dev/null || true
          cp -v "$CUDA_LIB_PATH"/libcublas.so* artifacts/ 2>/dev/null || true
          cp -v "$CUDA_LIB_PATH"/libcublasLt.so* artifacts/ 2>/dev/null || true
          cp -v "$CUDA_LIB_PATH"/libnvblas.so* artifacts/ 2>/dev/null || true

          echo "=== Copied .so files ==="
          ls -lh artifacts/*.so* 2>/dev/null || echo "No .so files found"

      - name: Package
        run: |
          MODE="${{ matrix.package }}"
          BASE="${{ matrix.output }}"
          mkdir -p upload
          case "$MODE" in
            plain)
              cp artifacts/*.node upload/
              ;;
            gz)
              gzip -6 -c "artifacts/addon-${BASE}.node" > "upload/addon-${BASE}.node.gz"
              ;;
            cuda)
              gzip -6 -c "artifacts/addon-${BASE}.node" > "upload/addon-${BASE}.node.gz"
              (cd artifacts && tar -cf - *) | gzip -6 > "upload/${BASE}.tar.gz"
              ;;
          esac
          ls -lh upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: upload/*

  # 创建或更新 Release
  create-update-release:
    needs: [build-macos, build-windows, build-linux]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_gitcode_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts/

      - name: Flatten artifacts for release
        run: |
          mkdir -p release_files
          # Copy all .node, .node.gz, and .tar.gz files
          find artifacts -type f \( -name "*.node" -o -name "*.gz" \) -exec cp {} release_files/ \;
          ls -lh release_files/

      - name: Generate addon-versions.json
        run: |
          cd release_files

          # Try to download existing addon-versions.json from current latest release
          curl -sL -o _existing_versions.json \
            "https://github.com/buxuku/whisper.cpp/releases/download/latest/addon-versions.json" 2>/dev/null || echo '{}' > _existing_versions.json

          # Validate the downloaded file is valid JSON
          python3 -c "import json; json.load(open('_existing_versions.json'))" 2>/dev/null || echo '{}' > _existing_versions.json

          # Generate addon-versions.json using Python
          python3 - <<'PYSCRIPT'
          import json, subprocess, os
          from datetime import datetime

          try:
              with open("_existing_versions.json") as f:
                  existing = json.load(f)
              print(f"Loaded existing addon-versions.json with {len(existing)} entries")
          except Exception:
              existing = {}
              print("Starting with empty addon-versions.json")

          version = datetime.utcnow().strftime("%Y.%m.%d")

          configs = [
              ("11.8.0", "1180"),
              ("12.2.0", "1220"),
              ("12.4.0", "1240"),
              ("13.0.2", "1302"),
          ]

          def sha256_file(filepath):
              if os.path.isfile(filepath):
                  result = subprocess.run(["sha256sum", filepath], capture_output=True, text=True)
                  if result.returncode == 0:
                      return result.stdout.split()[0]
              return ""

          result = {}
          for cuda_ver, prefix in configs:
              win_tar = sha256_file(f"windows-cuda-{prefix}-optimized.tar.gz")
              win_node = sha256_file(f"addon-windows-cuda-{prefix}-optimized.node.gz")
              linux_tar = sha256_file(f"linux-cuda-{prefix}-optimized.tar.gz")
              linux_node = sha256_file(f"addon-linux-cuda-{prefix}-optimized.node.gz")

              has_new_artifacts = any([win_tar, win_node, linux_tar, linux_node])

              if has_new_artifacts:
                  result[cuda_ver] = {
                      "version": version,
                      "updateNotes": "Auto-built from whisper.cpp master branch",
                      "checksum": {
                          "windows-tar": win_tar,
                          "windows-node": win_node,
                          "linux-tar": linux_tar,
                          "linux-node": linux_node,
                      }
                  }
                  print(f"  CUDA {cuda_ver}: updated with new checksums")
              elif cuda_ver in existing:
                  result[cuda_ver] = existing[cuda_ver]
                  print(f"  CUDA {cuda_ver}: preserved from existing release")
              else:
                  print(f"  CUDA {cuda_ver}: skipped (no artifacts, no existing entry)")

          # Vulkan: 跨厂商通用 GPU 包（NVIDIA/AMD/Intel），单一产物无需区分 CUDA 版本
          vulkan_win = sha256_file("addon-windows-vulkan.node.gz")
          vulkan_linux = sha256_file("addon-linux-vulkan.node.gz")
          if vulkan_win or vulkan_linux:
              result["vulkan"] = {
                  "version": version,
                  "updateNotes": "Auto-built from whisper.cpp master branch",
                  "checksum": {
                      "windows-node": vulkan_win,
                      "linux-node": vulkan_linux,
                  }
              }
              print("  Vulkan: updated with new checksums")
          elif "vulkan" in existing:
              result["vulkan"] = existing["vulkan"]
              print("  Vulkan: preserved from existing release")
          else:
              print("  Vulkan: skipped (no artifacts, no existing entry)")

          with open("addon-versions.json", "w") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"\nGenerated addon-versions.json with {len(result)} entries")
          PYSCRIPT

          rm -f _existing_versions.json

          echo "=== Generated addon-versions.json ==="
          cat addon-versions.json
          cd ..

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Timestamped Release
        uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          tag_name: release-${{ steps.date.outputs.date }}
          name: whisper.cpp builds ${{ steps.date.outputs.date }}
          body: |
            whisper.cpp addon builds for multiple platforms (Build date: ${{ steps.date.outputs.date }})
            
            **Total: 15 artifacts**
            
            **macOS (uncompressed .node files):**
            - `addon-macos-x64.node` - macOS Intel (x64)
            - `addon-macos-arm64.node` - macOS ARM (arm64, with Metal)
            - `addon-macos-arm64-coreml.node` - macOS ARM (arm64, with CoreML)
            
            **Windows x64 (CPU only, uncompressed .node file):**
            - `addon-windows-x64.node` - Windows x64 (CPU only)
            
            **Linux x64 (CPU only, uncompressed .node file):**
            - `addon-linux-x64.node` - Linux x64 (CPU only)
            
            **Windows CUDA 12.4:**
            - `addon-windows-cuda-1240-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `windows-cuda-1240-optimized.tar.gz` - Addon + DLLs bundle (standalone)
            
            **Windows CUDA 13.0:**
            - `addon-windows-cuda-1302-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `windows-cuda-1302-optimized.tar.gz` - Addon + DLLs bundle (standalone)
            
            **Linux CUDA 12.4:**
            - `addon-linux-cuda-1240-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `linux-cuda-1240-optimized.tar.gz` - Addon + .so libs bundle (standalone)
            
            **Linux CUDA 13.0:**
            - `addon-linux-cuda-1302-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `linux-cuda-1302-optimized.tar.gz` - Addon + .so libs bundle (standalone)
            
            **Windows Vulkan (universal GPU: NVIDIA / AMD / Intel):**
            - `addon-windows-vulkan.node.gz` - Addon only (requires GPU driver with Vulkan support)
            
            **Linux Vulkan (universal GPU: NVIDIA / AMD / Intel):**
            - `addon-linux-vulkan.node.gz` - Addon only (requires GPU driver with Vulkan support)
            
            **Decompression:**
            - `.node.gz` files: `gunzip filename.node.gz` or use Node.js zlib
            - `.tar.gz` files: `tar -xzf filename.tar.gz` or use Node.js tar + zlib
          files: |
            release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          tag_name: latest
          name: Latest whisper.cpp builds
          body: |
            Latest whisper.cpp addon builds for multiple platforms.
            Last updated: ${{ steps.date.outputs.date }}
            
            **Total: 15 artifacts**
            
            **macOS (uncompressed .node files):**
            - `addon-macos-x64.node` - macOS Intel (x64)
            - `addon-macos-arm64.node` - macOS ARM (arm64, with Metal)
            - `addon-macos-arm64-coreml.node` - macOS ARM (arm64, with CoreML)
            
            **Windows x64 (CPU only, uncompressed .node file):**
            - `addon-windows-x64.node` - Windows x64 (CPU only)
            
            **Linux x64 (CPU only, uncompressed .node file):**
            - `addon-linux-x64.node` - Linux x64 (CPU only)
            
            **Windows CUDA 12.4:**
            - `addon-windows-cuda-1240-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `windows-cuda-1240-optimized.tar.gz` - Addon + DLLs bundle (standalone)
            
            **Windows CUDA 13.0:**
            - `addon-windows-cuda-1302-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `windows-cuda-1302-optimized.tar.gz` - Addon + DLLs bundle (standalone)
            
            **Linux CUDA 12.4:**
            - `addon-linux-cuda-1240-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `linux-cuda-1240-optimized.tar.gz` - Addon + .so libs bundle (standalone)
            
            **Linux CUDA 13.0:**
            - `addon-linux-cuda-1302-optimized.node.gz` - Addon only (requires CUDA Toolkit)
            - `linux-cuda-1302-optimized.tar.gz` - Addon + .so libs bundle (standalone)
            
            **Windows Vulkan (universal GPU: NVIDIA / AMD / Intel):**
            - `addon-windows-vulkan.node.gz` - Addon only (requires GPU driver with Vulkan support)
            
            **Linux Vulkan (universal GPU: NVIDIA / AMD / Intel):**
            - `addon-linux-vulkan.node.gz` - Addon only (requires GPU driver with Vulkan support)
            
            **Decompression:**
            - `.node.gz` files: `gunzip filename.node.gz` or use Node.js zlib
            - `.tar.gz` files: `tar -xzf filename.tar.gz` or use Node.js tar + zlib
          files: |
            release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 同步产物到 GitCode Release（tag=latest）；失败不阻断主流水线
  sync-gitcode-release:
    needs: [build-macos, build-windows, build-linux, create-update-release]
    if: ${{ always() && !cancelled() && (needs.create-update-release.result == 'success' || inputs.sync_gitcode_only == true) && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      GITCODE_OWNER: buxuku1
      GITCODE_REPO: whisper.node
      GITCODE_TAG: latest
      GITCODE_API_URL: https://api.gitcode.com/api/v5
      GITHUB_LEGACY_RELEASE_URL: https://github.com/buxuku/whisper.cpp/releases/download/latest
    steps:
      - name: Checkout sync script
        uses: actions/checkout@v6
        with:
          ref: builder
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        if: ${{ inputs.sync_gitcode_only != true }}
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Sync to GitCode Release
        run: bash scripts/sync-gitcode-release.sh
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          ARTIFACTS_DIR: artifacts
          SYNC_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_gitcode_only == true && 'github' || 'artifacts' }}
