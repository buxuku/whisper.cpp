            - `addon-linux-cuda-1302-generic.node.gz` - Linux x64 (with CUDA 13.0, generic)
            
            **Decompression:**
            - `.node.gz` files: `gunzip filename.node.gz` or use Node.js zlib
            - `.tar.gz` files: `tar -xzf filename.tar.gz` or use Node.js tar + zlib
          files: |
            release_files/*
