  # Linux x64 CUDA 12.4 构建
  linux-x64-cuda-12-4:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Clone whisper.cpp repository
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: master
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.14.0

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
          log-file-suffix: 'linux-1240-optimized.txt'

      - name: Verify CUDA installation
        run: |
          nvcc --version
          echo "CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git ninja-build

      - name: Install cmake-js
        run: npm install -g cmake-js

      - name: Install addon.node dependencies
        run: |
          cd examples/addon.node
          npm install

      - name: Build addon.node with CUDA
        run: |
          BUILD_PARAMS=(
            "--CDBUILD_SHARED_LIBS=OFF"
            "--CDWHISPER_STATIC=ON"
            "--CDGGML_CUDA=ON"
            "--CDGGML_NATIVE=OFF"
            "--CDCMAKE_POSITION_INDEPENDENT_CODE=ON"
            "--CDCMAKE_CUDA_ARCHITECTURES=all-major"
            "--runtime=electron"
            "--runtime-version=30.1.0"
            "--arch=x64"
          )
          
          echo "Build parameters: ${BUILD_PARAMS[@]}"
          npx cmake-js compile -T addon.node -B Release "${BUILD_PARAMS[@]}"
          
          mkdir -p artifacts
          cp build/Release/addon.node.node "artifacts/addon-linux-cuda-1240-optimized.node"

      - name: Copy CUDA libs
        run: |
          CUDA_LIB_PATH="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/lib64"
          echo "Copying CUDA libs from: $CUDA_LIB_PATH"
          
          cp -v "$CUDA_LIB_PATH"/libcudart.so* artifacts/ 2>/dev/null || true
          cp -v "$CUDA_LIB_PATH"/libcublas.so* artifacts/ 2>/dev/null || true
          cp -v "$CUDA_LIB_PATH"/libcublasLt.so* artifacts/ 2>/dev/null || true
          cp -v "$CUDA_LIB_PATH"/libnvblas.so* artifacts/ 2>/dev/null || true
          
          echo "=== Copied .so files ==="
          ls -lh artifacts/*.so* 2>/dev/null || echo "No .so files found"

      - name: Compress artifacts
        run: |
          OUTPUT_NAME="linux-cuda-1240-optimized"
          
          cd artifacts
          gzip -6 -k "addon-${OUTPUT_NAME}.node"
          mv "addon-${OUTPUT_NAME}.node.gz" "../addon-${OUTPUT_NAME}.node.gz"
          
          tar -cf - * | gzip -6 > "../${OUTPUT_NAME}.tar.gz"
          cd ..
          ls -lh *.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-cuda-1240-optimized
          path: |
            addon-linux-cuda-1240-optimized.node.gz
            linux-cuda-1240-optimized.tar.gz

