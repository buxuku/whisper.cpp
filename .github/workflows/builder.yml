          # 否则单个组件下载失败会被静默忽略，直到 CMake 链接阶段才报 CUDA::cublas not found。
          $components = @(
            "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-${CUDART_VER}-archive.zip",
            "cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-${CRT_VER}-archive.zip",
            "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-${NVCC_VER}-archive.zip",
            "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-${NVRTC_VER}-archive.zip",
            "libnvvm/windows-x86_64/libnvvm-windows-x86_64-${NVVM_VER}-archive.zip",
            "libcublas/windows-x86_64/libcublas-windows-x86_64-${CUBLAS_VER}-archive.zip",
            "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-${NVTX_VER}-archive.zip",
            "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-${PROFILER_VER}-archive.zip",
            "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-${VS_VER}-archive.zip",
            "cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-${CCCL_VER}-archive.zip"
          )
          # NVIDIA 的 redist CDN 会间歇性对存在的文件返回 404/52(Empty reply)，
          # 所以在 curl 自身重试之外再包一层外层重试，把单个组件的容错窗口拉到数分钟。
          foreach ($comp in $components) {
